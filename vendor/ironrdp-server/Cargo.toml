[package]
name = "ironrdp-server"
version = "0.14.0"
readme = "README.md"
description = "Extendable skeleton for implementing custom RDP servers"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[lib]
doctest = true
test = false

[features]
default = ["rayon", "qoi", "qoiz"]
helper = ["dep:x509-cert", "dep:rustls-pemfile"]
rayon = ["dep:rayon"]
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi", "ironrdp-pdu/qoiz"]
egfx = ["dep:ironrdp-egfx"]
usb = ["dep:ironrdp-rdpeusb", "dep:ironrdp-usb"]
# Opt-in NSCodec encoder. Off by default so consumers that don't need a legacy
# bitmap codec fallback (e.g., RemoteFX-only or H.264-capable clients) don't
# pay the extra build cost.
nscodec = ["dep:ironrdp-nscodec"]

# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.
__bench = ["dep:visibility"]
__test = ["dep:visibility"]

[dependencies]
rand = "0.9"
tokio = { version = "1", features = ["net", "macros", "sync", "rt", "time"] }
tokio-rustls = "0.26" # public
async-trait = "0.1"
ironrdp-async = { version = "0.12" }
ironrdp-ainput = { version = "0.10" }
ironrdp-connector = { version = "0.12" } # public
ironrdp-core = { version = "0.3" }
ironrdp-egfx = { version = "0.5", optional = true }
ironrdp-error = { version = "0.2", features = ["std"] } # public
ironrdp-nscodec = { version = "0.4", optional = true, features = ["encoder"] }
ironrdp-pdu = { version = "0.11" } # public
ironrdp-svc = { version = "0.10" } # public
ironrdp-cliprdr = { version = "0.9" } # public
ironrdp-displaycontrol = { version = "0.10" } # public
ironrdp-echo = { version = "0.6" } # public
ironrdp-dvc = { version = "0.10" } # public
ironrdp-tokio = { version = "0.12", features = ["reqwest"] }
ironrdp-acceptor = { version = "0.12" } # public
ironrdp-graphics = { version = "0.11" } # public
ironrdp-rdpdr = { version = "0.9" } # public
ironrdp-rdpsnd = { version = "0.11" } # public
ironrdp-rdpei = { version = "0.3" } # public
ironrdp-rdpeai = { version = "0.2" } # public
ironrdp-rdpeusb = { version = "0.2", optional = true }
ironrdp-usb = { version = "0.1", optional = true }
ironrdp-rdpemt = { version = "0.1" } # public
ironrdp-rdpeudp = { version = "0.1" } # public
ironrdp-rdpeudp-tokio = { version = "0.2" } # public
tracing = { version = "0.1", features = ["log"] }
x509-cert = { version = "0.3", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
rayon = { version = "1.12", optional = true }
bytes = "1"
visibility = { version = "0.1", optional = true }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "8.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }

[lints.rust]
warnings = { level = "allow", priority = 1 }

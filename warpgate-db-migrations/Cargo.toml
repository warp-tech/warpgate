[package]
name = "warpgate-db-migrations"
version = "0.28.3"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]

[dependencies]
data-encoding.workspace = true
regex.workspace = true
russh.workspace = true
sea-orm = { workspace = true, features = ["with-uuid", "with-json"] }
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
warpgate-ca = { path = "../warpgate-ca", default-features = false }
warpgate-db-entities = { path = "../warpgate-db-entities" }

[features]
# The migration schema-introspection helpers (`has_table`, `has_column`,
# `has_index`) are gated on the migration crate having the backend enabled
# too, not just sea-orm.
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]

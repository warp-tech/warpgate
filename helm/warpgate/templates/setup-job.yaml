{{- if .Values.setup.enabled }}
{{- if eq .Values.setup.type "job" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "warpgate.fullname" . }}-setup-job
  labels:
    {{- include "warpgate.labels" . | nindent 4 }}
  annotations:
    # Setup runs once, on install. As a hook the Job stays out of the release
    # manifest, so later upgrades don't try to patch its immutable spec, and
    # the previous one is replaced instead of blocking a reinstall.
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-setup
          {{- include "warpgate.setupContainer" . | trim | nindent 10 }}
          args:
            - --config=/data/warpgate.yaml
            - unattended-setup
            # A config that was provided rather than generated still needs the
            # admin user, see https://github.com/warp-tech/warpgate/issues/1618
            - --if-config-exists=ensure-admin
            {{- include "warpgate.unattendedSetupArgs" . | nindent 12 }}
            {{- if include "warpgate.tlsSecretName" . }}
            - --tls-certificate=/tls-cert/tls.crt
            - --tls-key=/tls-cert/tls.key
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if include "warpgate.tlsSecretName" . }}
            - name: tls-cert
              mountPath: /tls-cert
            {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- with include "warpgate.tlsSecretName" . }}
        - name: tls-cert
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- if .Values.data.pvc.enabled }}
        - name: data
          persistentVolumeClaim:
            {{- if .Values.data.pvc.claimName }}
            claimName: {{ .Values.data.pvc.claimName }}
            {{- else }}
            claimName: {{ include "warpgate.fullname" . }}-data
            {{- end }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
{{- end }}
{{- end }}

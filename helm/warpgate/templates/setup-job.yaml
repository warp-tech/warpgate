{{- if .Values.setup.enabled }}
{{- if eq .Values.setup.type "job" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "warpgate.fullname" . }}-setup-job
  labels:
    {{- include "warpgate.labels" . | nindent 4 }}
  annotations:
    # Setup runs once, on install. As a hook the Job stays out of the release
    # manifest, so later upgrades don't try to patch its immutable spec, and
    # the previous one is replaced instead of blocking a reinstall.
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-setup
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- with include "warpgate.setupEnv" . }}
          env:
            {{- . | trim | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              if [ -f /data/warpgate.yaml ]; then
                # Creates the admin user which is normally only created when the unattended-setup is called. REF: https://github.com/warp-tech/warpgate/issues/1618
                warpgate -c /data/warpgate.yaml create-user --password "$WARPGATE_ADMIN_PASSWORD" --role warpgate:admin admin
              else
                warpgate -c /data/warpgate.yaml unattended-setup --data-path /data{{ include "warpgate.unattendedSetupArgs" . }}

                {{- if .Values.setup.disableIpV6 }}
                sed -i 's/\[::\]:\([0-9]\+\)/0.0.0.0:\1/g' /data/warpgate.yaml
                {{- end }}
              fi

              # After setup: unattended-setup writes a self-signed cert unconditionally,
              # so the provided cert must be copied in afterwards to take effect.
              if [ -d /tls-cert ]; then
                cp /tls-cert/tls.crt /data/tls.certificate.pem
                cp /tls-cert/tls.key /data/tls.key.pem
              fi
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if include "warpgate.tlsSecretName" . }}
            - name: tls-cert
              mountPath: /tls-cert
            {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- with include "warpgate.tlsSecretName" . }}
        - name: tls-cert
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- if .Values.data.pvc.enabled }}
        - name: data
          persistentVolumeClaim:
            {{- if .Values.data.pvc.claimName }}
            claimName: {{ .Values.data.pvc.claimName }}
            {{- else }}
            claimName: {{ include "warpgate.fullname" . }}-data
            {{- end }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
{{- end }}
{{- end }}

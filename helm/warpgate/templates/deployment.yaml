{{- $tag := .Values.image.tag | default .Chart.AppVersion }}
{{- if and (regexMatch "^v?[0-9]+(\\.[0-9]+)+" $tag) (semverCompare "< 0.30.0-0" $tag) }}
{{- fail (printf "image.tag %q is too old: the setup init container needs Warpgate 0.30 or newer" $tag) }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (not (include "warpgate.databaseUrl" .)) }}
{{- fail "replicaCount > 1 needs a shared database: set postgresql.enabled=true or setup.databaseUrl" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warpgate.fullname" . }}
  labels:
    {{- include "warpgate.labels" . | nindent 4 }}
    {{- with .Values.deploymentLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.data.pvc.enabled }}
  # A ReadWriteOnce volume can't attach to the new pod while the old one holds it
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "warpgate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $configChecksum := include "warpgate.configChecksum" . }}
      {{- if or $configChecksum .Values.podAnnotations }}
      annotations:
        {{- if $configChecksum }}
        checksum/config: {{ $configChecksum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "warpgate.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "warpgate.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $seed := include "warpgate.seedSources" . }}
      {{- if or $seed .Values.setup.enabled }}
      initContainers:
        {{- if $seed }}
        - name: {{ .Chart.Name }}-install-files
          {{- include "warpgate.setupContainer" . | trim | nindent 10 }}
          args:
            - internal-install-files
            {{- with include "warpgate.configEnvVarReplace" . }}
            - {{ printf "--substitute-env=%s" . | quote }}
            {{- end }}
            - /seed
            - /data
          volumeMounts:
            {{- include "warpgate.initVolumeMounts" . | nindent 12 }}
        {{- end }}
        {{- if .Values.setup.enabled }}
        # Generates the config unless one was seeded above, and in both cases
        # initialises an empty database (admin user, defaults, SSH keys).
        - name: {{ .Chart.Name }}-setup
          {{- include "warpgate.setupContainer" . | trim | nindent 10 }}
          args:
            - --config=/data/warpgate.yaml
            - unattended-setup
            - --if-config-exists=bootstrap
            {{- if .Values.ssh_keys_secret }}
            - --import-ssh-host-keys=/seed/ssh-keys
            - --import-ssh-client-keys=/seed/ssh-keys
            {{- end }}
            {{- if include "warpgate.tlsSecretName" . }}
            - --tls-certificate=/seed/tls.certificate.pem
            - --tls-key=/seed/tls.key.pem
            {{- end }}
            {{- include "warpgate.unattendedSetupArgs" . | nindent 12 }}
          volumeMounts:
            {{- include "warpgate.initVolumeMounts" . | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          {{- range $key, $val := .Values.envFromSecret }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ (split "/" $val)._0 }}
                  key: {{ (split "/" $val)._1 }}
          {{- end }}
          command:
            - warpgate
            - -c
            - /data/warpgate.yaml
            - run
          readinessProbe:
            exec:
              command:
                - warpgate
                - --config=/data/warpgate.yaml
                - healthcheck
            timeoutSeconds: 10
          ports:
            {{- if .Values.setup.ssh }}
            - name: ssh
              containerPort: {{ .Values.setup.ssh }}
              protocol: TCP
            {{- end }}
            {{- if .Values.setup.http }}
            - name: http
              containerPort: {{ .Values.setup.http }}
              protocol: TCP
            {{- end }}
            {{- if .Values.setup.mysql }}
            - name: mysql
              containerPort: {{ .Values.setup.mysql }}
              protocol: TCP
            {{- end }}
            {{- if .Values.setup.pgsql }}
            - name: pgsql
              containerPort: {{ .Values.setup.pgsql }}
              protocol: TCP
            {{- end }}
            {{- if .Values.setup.kubernetes }}
            - name: kubernetes
              containerPort: {{ .Values.setup.kubernetes }}
              protocol: TCP
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with .Values.volume_mounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: data
              mountPath: /data
      volumes:
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with include "warpgate.seedSources" . }}
        - name: seed
          projected:
            sources:
              {{- . | trim | nindent 14 }}
        {{- end }}
        {{- if .Values.data.pvc.enabled }}
        - name: data
          persistentVolumeClaim:
            {{- if .Values.data.pvc.claimName }}
            claimName: {{ .Values.data.pvc.claimName }}
            {{- else }}
            claimName: {{ include "warpgate.fullname" . }}-data
            {{- end }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if and (include "warpgate.renderConfig" .) (not .Values.tls_cert_secret) }}
{{- $name := include "warpgate.tlsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if or $existing .Release.IsInstall }}
{{- $hostnames := list }}
{{- range splitList "," (include "warpgate.tlsHostnames" .) }}{{- $hostnames = append $hostnames . }}{{- end }}
{{- $generated := genSelfSignedCert (first $hostnames) nil $hostnames 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "warpgate.labels" . | nindent 4 }}
  annotations:
    # Kept so that an upgrade can leave it out of the manifest when `lookup`
    # can't read the live certificate back, rather than issuing a new one.
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  # Self-signed stand-in for the certificate `unattended-setup` would have
  # written, shared by every pod. Set tls_cert_secret to serve your own.
  tls.crt: {{ index ($existing.data | default dict) "tls.crt" | default ($generated.Cert | b64enc) }}
  tls.key: {{ index ($existing.data | default dict) "tls.key" | default ($generated.Key | b64enc) }}
{{- end }}
{{- end }}

# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    labels: ["type/deps"]
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
    groups:
      rust-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/warpgate-web"
    labels: ["type/deps"]
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    labels: ["type/deps"]
    schedule:
      interval: weekly
    groups:
      actions-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    labels: ["type/deps"]
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /tests
    labels: ["type/deps"]
    exclude-paths:
      - api_sdk
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
    groups:
      pip-updates:
        applies-to: version-updates
        update-types:
          - patch
          - minor

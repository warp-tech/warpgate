[package]
name = "warpgate-desktop-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Standalone: not part of the server workspace in ../../Cargo.toml.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true

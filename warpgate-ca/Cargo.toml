[package]
name = "warpgate-ca"
version = "0.28.5"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
aws-lc-rs = { version = "1", default-features = false }
const-oid = { version = "0.9", default-features = false, features = ["db"] }
data-encoding.workspace = true
der = { version = "0.7", default-features = false, features = ["pem", "alloc"] }

hex = { workspace = true, features = ["alloc"] }
pem = { version = "3.0", default-features = false }
rcgen.workspace = true
spki = { version = "0.7", default-features = false, features = ["pem"] }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
x509-cert = { version = "0.2", features = [
    "builder",
    "signature",
], default-features = false }
x509-parser.workspace = true

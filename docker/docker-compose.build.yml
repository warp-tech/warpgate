# Local-build override.
#
# docker-compose.yml pulls the published image (ghcr.io/warp-tech/warpgate).
# This file layers a `build:` onto that service so the image is built from the
# working tree instead. It is kept separate rather than merged into the main
# compose file so that `docker compose up` on its own still behaves the way
# upstream intends — pull and run, no toolchain required.
#
# Usage, from the REPOSITORY ROOT (the build context must be the repo root:
# the Dockerfile does `COPY . /opt/warpgate` and `COPY .git/`):
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.build.yml build
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.build.yml up
#
# Select the UI with WARPGATE_NEW_UI in the environment (default false):
#
#   WARPGATE_NEW_UI=true docker compose -f docker/docker-compose.yml -f docker/docker-compose.build.yml build
#
# The two UIs produce different images. Tagging them apart is worth the
# keystroke — otherwise the only way to tell which one you are running is to
# open it, and `docker inspect` will tell you via the org.warpgate.new-ui
# label either way.

services:
  warpgate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Accepts 1/true/yes/on; anything unrecognised fails the build rather
        # than quietly producing the other UI.
        VITE_NEW_UI: ${WARPGATE_NEW_UI:-false}
    image: warpgate-local:${WARPGATE_NEW_UI:-false}

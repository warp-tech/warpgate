apiVersion: warpgate/v1
kind: Target
metadata:
  name: malformed-reference
spec:
  options:
    postgres:
      host: db
      auth:
        kind: password
        password: secret://vault/kv/db
---
apiVersion: warpgate/v1
kind: Target
metadata:
  name: certificate-names
spec:
  options:
    ssh:
      host: h
      auth:
        kind: certificate
        backend: vault
        mount: ../../sys
        role: deploy
---
apiVersion: warpgate/v1
kind: Target
metadata:
  name: kdc-url
spec:
  options:
    rdp:
      host: h
      kdc_url: ftp://kdc
